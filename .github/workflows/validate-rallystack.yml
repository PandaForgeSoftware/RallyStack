name: Validate RallyStack loadout branch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync and verify current WARDOGS data
        run: node scripts/sync-wardogs-all.mjs

      - name: Build RallyStack
        run: npm run build
